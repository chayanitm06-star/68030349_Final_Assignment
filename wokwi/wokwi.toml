# Wokwi firmware configuration
#
# Copy this file next to the diagram.json in your Wokwi project so that the
# simulator uploads the firmware built by ESP-IDF:
#
#   idf.py build            ->  build/esp32_digital_clock.bin
#
# The project name comes from the root CMakeLists.txt ("esp32_digital_clock").

[firmware]
firmware = "build/esp32_digital_clock.bin"
